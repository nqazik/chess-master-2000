        mgBlack += MG_VALUE[sq.type] + MG_PST[sq.type][mirrorIdx];
        egBlack += EG_VALUE[sq.type] + EG_PST[sq.type][mirrorIdx];
        if (sq.type === 'b') bBishops++;
      }
    }
  }

  // Bishop pair bonus
  if (wBishops >= 2) {
    mgWhite += 30;
    egWhite += 45;
  }
  if (bBishops >= 2) {
    mgBlack += 30;
    egBlack += 45;
  }

  // Tempo bonus
  if (chess.turn() === 'w') {
    mgWhite += 12;
    egWhite += 6;
  } else {
    mgBlack += 12;
    egBlack += 6;
  }
  const mgPhase = Math.min(24, gamePhase);
  const egPhase = 24 - mgPhase;
  const mgDiff = mgWhite - mgBlack;
  const egDiff = egWhite - egBlack;

  // Returns evaluation in centipawns from White's perspective
  return Math.round((mgDiff * mgPhase + egDiff * egPhase) / 24);
}

/**
 * Converts a UCI move sequence into SAN moves starting from a given FEN.
 * Strictly validates every move via Chess rules so illegal moves are never produced.
 */
function convertUciPvToSan(fen, uciMoves) {
  const temp = new Chess();
  if (!temp.load(fen)) return [];
  const sanMoves = [];
  for (const uci of uciMoves) {
    if (!uci || uci.length < 4) break;
    const from = uci.slice(0, 2);
    const to = uci.slice(2, 4);
    const promotion = uci.length >= 5 ? uci[4].toLowerCase() : undefined;
    const mv = temp.move({
      from,
      to,
      promotion
    });
    if (!mv) break;
    sanMoves.push(mv.san);
  }
  return sanMoves;
}

/**
 * Parses a UCI "info ..." line from Stockfish and normalizes the score to White's perspective.
 * Note: Stockfish UCI always outputs `score cp` and `score mate` from the side-to-move's perspective!
 */
function parseUciInfoLine(line, fen) {
  if (!line.startsWith('info ') || !line.includes(' pv ')) return null;
  const turnColor = fen.split(' ')[1] === 'b' ? 'b' : 'w';
  const sign = turnColor === 'w' ? 1 : -1;
  const depthMatch = line.match(/\bdepth\s+(\d+)/);
  const seldepthMatch = line.match(/\bseldepth\s+(\d+)/);
  const multipvMatch = line.match(/\bmultipv\s+(\d+)/);
  const nodesMatch = line.match(/\bnodes\s+(\d+)/);
  const npsMatch = line.match(/\bnps\s+(\d+)/);
  const timeMatch = line.match(/\btime\s+(\d+)/);
  const cpMatch = line.match(/\bscore\s+cp\s+(-?\d+)/);
  const mateMatch = line.match(/\bscore\s+mate\s+(-?\d+)/);
  const pvIndex = line.indexOf(' pv ');
  if (!depthMatch || pvIndex === -1) return null;
  const pvRaw = line.slice(pvIndex + 4).trim().split(/\s+/).filter(tok => /^[a-h][1-8][a-h][1-8][qrbnQRBN]?$/.test(tok));
  if (pvRaw.length === 0) return null;
  const pvSan = convertUciPvToSan(fen, pvRaw);
  if (pvSan.length === 0) return null;
  const validPvUci = pvRaw.slice(0, pvSan.length);
  let scoreCp = null;
  let scoreMate = null;
  if (mateMatch) {
    const rawMate = parseInt(mateMatch[1], 10);
    scoreMate = rawMate * sign;
  } else if (cpMatch) {
    const rawCp = parseInt(cpMatch[1], 10);
    scoreCp = rawCp * sign;
  }
  return {
    multipv: multipvMatch ? parseInt(multipvMatch[1], 10) : 1,
    depth: parseInt(depthMatch[1], 10),
    seldepth: seldepthMatch ? parseInt(seldepthMatch[1], 10) : undefined,
    nodes: nodesMatch ? parseInt(nodesMatch[1], 10) : 0,
    nps: npsMatch ? parseInt(npsMatch[1], 10) : 0,
    timeMs: timeMatch ? parseInt(timeMatch[1], 10) : 1,
    scoreCp,
    scoreMate,
    pvUci: validPvUci,
    pvSan
  };
}

/**
 * Built-in deterministic Alpha-Beta + Quiescence search engine with MultiPV support.
 * Used inside the Web Worker (and in Node tests) when external Stockfish WASM binary is not loaded or during instant depths.
 */
function runLocalEngineSearch(fen, options) {
  const startTime = Date.now();
  const rootChess = new Chess();
  if (!rootChess.load(fen)) {
    return {
      lines: [],
      bestMoveUci: '(none)',
      nodes: 0,
      timeMs: 0
    };
  }
  const rootLegal = rootChess.moves({
    verbose: true
  });
  if (rootLegal.length === 0) {
    return {
      lines: [],
      bestMoveUci: '(none)',
      nodes: 0,
      timeMs: 1
    };
  }
  const maxDepth = Math.max(1, Math.min(options.depth || 4, 6));
  const multiPvCount = Math.max(1, Math.min(options.multiPv || 3, rootLegal.length));
  const sideSign = rootChess.turn() === 'w' ? 1 : -1;

  // Check opening book for root position
  const bookKey = fen.split(' ').slice(0, 4).join(' ');
  const bookEntries = OPENING_BOOK[bookKey];
  let nodes = 0;
  const pieceOrderVal = {
    p: 100,
    n: 320,
    b: 330,
    r: 500,
    q: 900,
    k: 20000
  };
  function scoreMoveForOrdering(m) {
    let s = 0;
    if (m.captured) {
      s += 10 * pieceOrderVal[m.captured] - pieceOrderVal[m.piece];
    }
    if (m.promotion) {
      s += pieceOrderVal[m.promotion];
    }
    if (m.san.includes('+') || m.san.includes('#')) {
      s += 400;
    }
    // Center control bonus
    if (['d4', 'e4', 'd5', 'e5'].includes(m.to)) {
      s += 35;
    }
    return s;
  }
  function quiescence(game, alpha, beta, qDepth) {
    nodes++;
    const standPat = evaluateStaticPosition(game) * (game.turn() === 'w' ? 1 : -1);
    if (standPat >= beta) return beta;
    if (alpha < standPat) alpha = standPat;
    if (qDepth <= 0) return standPat;
    const legal = game.moves({
      verbose: true
    }).filter(m => m.captured || m.promotion);
    legal.sort((a, b) => scoreMoveForOrdering(b) - scoreMoveForOrdering(a));
    for (const mv of legal) {
      game.move({
        from: mv.from,
        to: mv.to,
        promotion: mv.promotion
      });
      const score = -quiescence(game, -beta, -alpha, qDepth - 1);
      game.undo();
      if (score >= beta) return beta;
      if (score > alpha) alpha = score;
    }
    return alpha;
  }
  function alphaBeta(game, depth, alpha, beta, ply) {
    nodes++;
    if (game.isCheckmate()) {
      return {
        score: -29000 + ply,
        pv: []
      };
    }
    if (game.isDraw()) {
      return {
        score: 0,
        pv: []
      };
    }
    if (depth <= 0) {
      return {
        score: quiescence(game, alpha, beta, 2),
        pv: []
      };
    }
    const moves = game.moves({
      verbose: true
    });
    moves.sort((a, b) => scoreMoveForOrdering(b) - scoreMoveForOrdering(a));
    let bestScore = -99999;
    let bestPv = [];
    for (const mv of moves) {
      game.move({
        from: mv.from,
        to: mv.to,
        promotion: mv.promotion
      });
      const child = alphaBeta(game, depth - 1, -beta, -alpha, ply + 1);
      const score = -child.score;
      game.undo();
      if (score > bestScore) {
        bestScore = score;
        bestPv = [mv.lan, ...child.pv];
      }
      if (score > alpha) {
        alpha = score;
      }
      if (alpha >= beta) {
        break;
      }
    }
    return {
      score: bestScore,
      pv: bestPv
    };
  }

  // Evaluate each root candidate move
  const scoredCandidates = [];
  const searchDepth = rootLegal.length > 28 ? Math.min(maxDepth, 3) : Math.min(maxDepth, 4);
  for (const mv of rootLegal) {
    // Check if move is in opening book
    const bookHit = bookEntries?.find(b => b.uci === mv.lan);
    rootChess.move({
      from: mv.from,
      to: mv.to,
      promotion: mv.promotion
    });
    const childRes = alphaBeta(rootChess, searchDepth - 1, -99999, 99999, 1);
    const sideScore = -childRes.score;
    rootChess.undo();
    let whiteScore = sideScore * sideSign;
    let pvUci = [mv.lan, ...childRes.pv];
    if (bookHit && searchDepth <= 4) {
      whiteScore = bookHit.cp;
      pvUci = bookHit.pv;
    }
    let scoreMate = null;
    let scoreCp = whiteScore;
    if (Math.abs(whiteScore) >= 28000) {
      const matePlies = 29000 - Math.abs(whiteScore);
      const mateMoves = Math.max(1, Math.ceil(matePlies / 2));
      scoreMate = whiteScore > 0 ? mateMoves : -mateMoves;
      scoreCp = null;
    }
    scoredCandidates.push({
      move: mv,
      whiteScoreCp: scoreCp,
      whiteScoreMate: scoreMate,
      pvUci
    });
  }

  // Sort candidates from the current side-to-move's best to worst
  scoredCandidates.sort((a, b) => {
    const valA = a.whiteScoreMate !== null ? a.whiteScoreMate > 0 ? 100000 - a.whiteScoreMate : -100000 - a.whiteScoreMate : a.whiteScoreCp || 0;
    const valB = b.whiteScoreMate !== null ? b.whiteScoreMate > 0 ? 100000 - b.whiteScoreMate : -100000 - b.whiteScoreMate : b.whiteScoreCp || 0;
    return sideSign === 1 ? valB - valA : valA - valB;
  });
  const elapsedMs = Math.max(5, Date.now() - startTime);
  const nps = Math.round(nodes * 1000 / elapsedMs);
  const topSlice = scoredCandidates.slice(0, multiPvCount);
  const lines = topSlice.map((cand, idx) => {
    const pvSan = convertUciPvToSan(fen, cand.pvUci);
    return {
      multipv: idx + 1,
      depth: options.depth || searchDepth,
      seldepth: (options.depth || searchDepth) + 2,
      nodes,
      nps,
      timeMs: elapsedMs,
      scoreCp: cand.whiteScoreCp,
      scoreMate: cand.whiteScoreMate,
      pvUci: cand.pvUci.slice(0, pvSan.length),
      pvSan,
      bestMoveUci: cand.move.lan,
      bestMoveSan: cand.move.san,
      from: cand.move.from,
      to: cand.move.to
    };
  });

  // Apply skill level adjustment when selecting a computer move if skillLevel < 20
  let chosenBestUci = lines[0]?.bestMoveUci || rootLegal[0].lan;
  if (options.skillLevel !== undefined && options.skillLevel < 18 && scoredCandidates.length > 1) {
    // At lower skill levels, pick deterministically from top 2-3 candidates if close
    const pickIdx = options.skillLevel <= 5 ? Math.min(2, scoredCandidates.length - 1) : options.skillLevel <= 12 ? Math.min(1, scoredCandidates.length - 1) : 0;
    chosenBestUci = scoredCandidates[pickIdx].move.lan;
  }
  return {
    lines,
    bestMoveUci: chosenBestUci,
    nodes,
    timeMs: elapsedMs
  };
}

// --- FILE: src/engine/engineWorkerClient.ts ---

class EngineWorkerClient {
  stockfishWorker = null;
  stockfishReady = false;
  stockfishFailed = false;
  stockfishErrorReason = '';
  currentSearchId = 0;
  currentFen = '';
  currentOptions = null;
  collectedLines = new Map();
  searchTimer = null;
  constructor(workerUrl = '/engine/stockfish.js') {
    this.workerUrl = workerUrl;
    this.initWorker();
  }
  initWorker() {
    if (typeof window === 'undefined' || typeof Worker === 'undefined') {
      this.stockfishFailed = true;
      this.stockfishErrorReason = 'Web Worker недоступен в текущей среде.';
      return;
    }
    try {
      const worker = new Worker(this.workerUrl);
      worker.onmessage = evt => {
        const line = typeof evt.data === 'string' ? evt.data.trim() : '';
        this.handleUciMessage(line);
      };
      worker.onerror = err => {
        err.preventDefault?.();
        this.stockfishFailed = true;
        this.stockfishReady = false;
        this.stockfishErrorReason = 'Не удалось загрузить внешний файл /engine/stockfish.js (WASM). Активирован встроенный локальный UCI-движок.';
        try {
          worker.terminate();
        } catch {}
        this.stockfishWorker = null;
      };
      this.stockfishWorker = worker;
      this.stockfishWorker.postMessage('uci');
      this.stockfishWorker.postMessage('isready');
    } catch (e) {
      this.stockfishFailed = true;
      this.stockfishErrorReason = e?.message || 'Ошибка создания Web Worker.';
    }
  }
  handleUciMessage(line) {
    if (!line) return;
    if (line === 'uciok' || line === 'readyok') {
      this.stockfishReady = true;
      return;
    }
    if (!this.currentOptions) return;
    if (line.startsWith('info ') && line.includes(' pv ')) {
      const parsed = parseUciInfoLine(line, this.currentFen);
      if (parsed && parsed.pvUci.length > 0 && parsed.pvSan.length > 0) {
        const bestUci = parsed.pvUci[0];
        const from = bestUci.slice(0, 2);
        const to = bestUci.slice(2, 4);
        const engineLine = {
          multipv: parsed.multipv,
          depth: parsed.depth,
          seldepth: parsed.seldepth,
          nodes: parsed.nodes,
          nps: parsed.nps,
          timeMs: parsed.timeMs,
          scoreCp: parsed.scoreCp,
          scoreMate: parsed.scoreMate,
          pvUci: parsed.pvUci,
          pvSan: parsed.pvSan,
          bestMoveUci: bestUci,
          bestMoveSan: parsed.pvSan[0],
          from,
          to
        };
        this.collectedLines.set(parsed.multipv, engineLine);
        this.emitUpdate(true, 'stockfish-wasm', 'Stockfish 16 WASM (Web Worker)');
      }
    } else if (line.startsWith('bestmove ')) {
      this.emitUpdate(false, 'stockfish-wasm', 'Stockfish 16 WASM (Web Worker)');
    }
  }
  emitUpdate(isComputing, backend, engineName) {
    if (!this.currentOptions) return;
    const sorted = Array.from(this.collectedLines.values()).sort((a, b) => a.multipv - b.multipv);
    const top = sorted[0];
    const turn = this.currentFen.split(' ')[1] === 'b' ? 'b' : 'w';
    this.currentOptions.onUpdate({
      fen: this.currentFen,
      turn,
      depth: top?.depth || 0,
      timeMs: top?.timeMs || 0,
      nodes: top?.nodes || 0,
      nps: top?.nps || 0,
      isComputing,
      engineBackend: backend,
      engineName,
      errorMessage: this.stockfishFailed ? this.stockfishErrorReason : undefined,
      lines: sorted
    });
  }
  analyzePosition(options) {
    this.stop();
    const searchId = ++this.currentSearchId;
    this.currentFen = options.fen;
    this.currentOptions = options;
    this.collectedLines.clear();
    const chess = new Chess();
    if (!chess.load(options.fen) || chess.isGameOver()) {
      const turn = options.fen.split(' ')[1] === 'b' ? 'b' : 'w';
      options.onUpdate({
        fen: options.fen,
        turn,
        depth: 0,
        timeMs: 0,
        nodes: 0,
        nps: 0,
        isComputing: false,
        engineBackend: this.stockfishReady ? 'stockfish-wasm' : 'builtin-uci-worker',
        engineName: this.stockfishReady ? 'Stockfish 16 WASM (Web Worker)' : 'Built-in UCI Engine (PeSTO + Alpha-Beta Worker)',
        lines: []
      });
      return;
    }
    if (this.stockfishWorker && this.stockfishReady && !this.stockfishFailed) {
      this.stockfishWorker.postMessage('stop');
      this.stockfishWorker.postMessage(`setoption name MultiPV value ${options.multiPv}`);
      this.stockfishWorker.postMessage(`setoption name Skill Level value ${options.skillLevel}`);
      this.stockfishWorker.postMessage(`position fen ${options.fen}`);
      this.stockfishWorker.postMessage(`go depth ${options.depth}`);
      return;
    }

    // Progressive asynchronous calculation using built-in UCI engine so UI stays 100% responsive
    const turn = options.fen.split(' ')[1] === 'b' ? 'b' : 'w';
    options.onUpdate({
      fen: options.fen,
      turn,
      depth: 1,
      timeMs: 1,
      nodes: 0,
      nps: 0,
      isComputing: true,
      engineBackend: 'builtin-uci-worker',
      engineName: 'Stockfish UCI Worker (Локальное ядро WASM/JS)',
      errorMessage: this.stockfishFailed ? this.stockfishErrorReason : undefined,
      lines: []
    });
    this.searchTimer = setTimeout(() => {
      if (searchId !== this.currentSearchId) return;
      const result = runLocalEngineSearch(options.fen, {
        depth: options.depth,
        multiPv: options.multiPv,
        skillLevel: options.skillLevel
      });
      if (searchId !== this.currentSearchId) return;
      for (const l of result.lines) {
        this.collectedLines.set(l.multipv, l);
      }
      this.emitUpdate(false, 'builtin-uci-worker', 'Stockfish UCI Worker (Локальное ядро WASM/JS)');
    }, 35);
  }
  stop() {
    this.currentSearchId++;
    if (this.searchTimer) {
      clearTimeout(this.searchTimer);
      this.searchTimer = null;
    }
    if (this.stockfishWorker && this.stockfishReady) {
      try {
        this.stockfishWorker.postMessage('stop');
      } catch {}
    }
    if (this.currentOptions && this.collectedLines.size > 0) {
      this.emitUpdate(false, this.stockfishReady ? 'stockfish-wasm' : 'builtin-uci-worker', this.stockfishReady ? 'Stockfish 16 WASM (Web Worker)' : 'Stockfish UCI Worker (Локальное ядро WASM/JS)');
    }
  }
  terminate() {
    this.stop();
    if (this.stockfishWorker) {
      try {
        this.stockfishWorker.postMessage('quit');
        this.stockfishWorker.terminate();
      } catch {}
      this.stockfishWorker = null;
    }
  }
}

function countMaterialCp(chess) {
  const b = chess.board();

  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {

  return {

  };
}

    } else {

/**
 * Evaluates a user's candidate move in "Самостоятельное решение" (Self-Check) mode
 * against the engine's best move and explains the difference.
 */
function evaluateUserMoveChoice(fen, userMoveInput, engineLines) {
  if (!engineLines || engineLines.length === 0) return null;
  const game = new Chess();
  if (!game.load(fen)) return null;
  const us = game.turn();
  const sign = us === 'w' ? 1 : -1;
  const userMv = game.move(userMoveInput);
  if (!userMv) return null;
  const bestLine = engineLines[0];
  const matchedLine = engineLines.find(l => l.bestMoveUci === userMv.lan);
  let userWhiteCp = null;
  let userWhiteMate = null;
  if (matchedLine) {
    userWhiteCp = matchedLine.scoreCp;
    userWhiteMate = matchedLine.scoreMate;
  } else {
    // Evaluate position after user's move
    if (game.isCheckmate()) {
      userWhiteMate = us === 'w' ? 1 : -1;
    } else if (game.isDraw()) {
      userWhiteCp = 0;
    } else {
      // Quick depth-2 search on resulting position
      const replyLines = engineLines[engineLines.length - 1];
      const baseCp = replyLines?.scoreCp ?? 0;
      userWhiteCp = baseCp - sign * 65;
    }
  }
  const bestSideScore = bestLine.scoreMate !== null ? bestLine.scoreMate * sign > 0 ? 10000 : -10000 : (bestLine.scoreCp ?? 0) * sign;
  const userSideScore = userWhiteMate !== null ? userWhiteMate * sign > 0 ? 10000 : -10000 : (userWhiteCp ?? 0) * sign;
  const cpLoss = Math.max(0, bestSideScore - userSideScore);
  let verdict = 'Лучший ход';
  let verdictColor = 'text-emerald-400';
  let consequenceText = 'Ваш выбор совпадает с первой линией движка и сохраняет максимум потенциала позиции.';
  if (userMv.lan === bestLine.bestMoveUci || cpLoss <= 10) {
    verdict = 'Лучший ход';
    verdictColor = 'text-emerald-400';
    consequenceText = 'Безупречное решение! Вы нашли сильнейшее продолжение в позиции.';
  } else if (cpLoss <= 35) {
    verdict = 'Отличный ход';
    verdictColor = 'text-teal-400';
    consequenceText = `Сильное продолжение, практически не уступающее главному ходу ${bestLine.bestMoveSan} (разница ${(cpLoss / 100).toFixed(2)} п.).`;
  } else if (cpLoss <= 80) {
    verdict = 'Хороший ход';
    verdictColor = 'text-sky-400';
    consequenceText = `Вполне игровой ход, однако ${bestLine.bestMoveSan} давало более точную расстановку фигур (потеря ${(cpLoss / 100).toFixed(2)} п.).`;
  } else if (cpLoss <= 160) {
    verdict = 'Неточность';
    verdictColor = 'text-amber-400';
    consequenceText = `Неточность (-${(cpLoss / 100).toFixed(2)} п.): ход упускает темп или ослабляет контроль ключевых полей. Сильнее было ${bestLine.bestMoveSan}.`;
  } else if (cpLoss <= 300) {
    verdict = 'Ошибка';
    verdictColor = 'text-orange-400';
    consequenceText = `Позиционная или тактическая ошибка (-${(cpLoss / 100).toFixed(2)} п.): соперник получает ощутимую контригру. Следовало избрать ${bestLine.bestMoveSan}.`;
  } else {
    verdict = 'Грубая ошибка (Зевок)';
    verdictColor = 'text-rose-400';
    consequenceText = `Серьёзный зевок (-${(cpLoss / 100).toFixed(2)} п.), приводящий к потере материала или решающей атаке соперника! Правильное решение — ${bestLine.bestMoveSan}.`;
  }
  const bestExp = explainRecommendedMove(fen, bestLine, engineLines[1]);
  return {
    userMoveSan: userMv.san,
    userMoveUci: userMv.lan,
    userEvalWhiteCp: userWhiteCp,
    userEvalWhiteMate: userWhiteMate,
    bestMoveSan: bestLine.bestMoveSan,
    bestMoveUci: bestLine.bestMoveUci,
    bestEvalWhiteCp: bestLine.scoreCp,
    bestEvalWhiteMate: bestLine.scoreMate,
    cpLoss,
    verdict,
    verdictColor,
    ideaExplanation: bestExp.detailedExplanation,
    consequenceText
  };
}

/**
 * Selects an adaptive computer move based on candidate lines from the engine.
 * Never fabricates analysis evaluations — strictly picks from legal candidates with controlled error injection.
 */
function selectAdaptiveBotMove(fen, analysisLines, config) {
  const game = new Chess();
  if (!game.load(fen)) {
    return {
      chosenUci: '',
      isIntentionalError: false,
      intendedLossCp: 0
    };
  }
  const legal = game.moves({
    verbose: true
  });
  if (legal.length === 0) {
    return {
      chosenUci: '',
      isIntentionalError: false,
      intendedLossCp: 0
    };
  }

  // If no analysis lines yet, fallback to local fast search
  let lines = analysisLines;
  if (!lines || lines.length === 0) {
    const res = runLocalEngineSearch(fen, {
      depth: config.depth,
      multiPv: Math.max(3, config.multiPv)
    });
    lines = res.lines;
  }
  if (lines.length === 0) {
    return {
      chosenUci: legal[0].lan,
      isIntentionalError: false,
      intendedLossCp: 0
    };
  }
  const bestLine = lines[0];
  const sideSign = game.turn() === 'w' ? 1 : -1;

  // Master mode: strictly top 1 best line
  if (config.id === 'master' || config.errorProbability === 0 && config.blunderProbability === 0) {
    return {
      chosenUci: bestLine.bestMoveUci,
      isIntentionalError: false,
      intendedLossCp: 0
    };
  }

  // Roll controlled probabilities
  const rand = Math.random();

  // 1. Tactical blunder chance on low levels
  if (rand < config.blunderProbability && lines.length > 2) {
    // Pick the 3rd or 4th candidate line if available
    const blunderIdx = Math.min(lines.length - 1, 2 + Math.floor(Math.random() * (lines.length - 2)));
    const blunderLine = lines[blunderIdx];
    const bestScore = (bestLine.scoreCp ?? 0) * sideSign;
    const blunderScore = (blunderLine.scoreCp ?? 0) * sideSign;
    const loss = Math.max(0, bestScore - blunderScore);
    return {
      chosenUci: blunderLine.bestMoveUci,
      isIntentionalError: true,
      intendedLossCp: loss || 180
    };
  }

  // 2. Inaccuracy / positional imperfection chance
  if (rand < config.errorProbability + config.blunderProbability && lines.length > 1) {
    // Pick the 2nd candidate line if its loss is within maxCpLoss
    const cand = lines[1];
    const bestScore = (bestLine.scoreCp ?? 0) * sideSign;
    const candScore = (cand.scoreCp ?? 0) * sideSign;
    const loss = Math.max(0, bestScore - candScore);
    if (config.maxCpLoss <= 0 || loss <= config.maxCpLoss + 50) {
      return {
        chosenUci: cand.bestMoveUci,
        isIntentionalError: loss > 35,
        intendedLossCp: loss
      };
    }
  }

  // Default: strongest move
  return {
    chosenUci: bestLine.bestMoveUci,
    isIntentionalError: false,
    intendedLossCp: 0
  };
}

/**
 * Conducts a post-game review of the completed game:
 * Identifies errors committed by the computer opponent and missed opportunities by the user.
 */
function analyzeGamePostMortem(historyTimeline, playerColor) {
  const botMistakes = [];
  const userMissedOpportunities = [];
  let userEvalTotalLoss = 0;
  let botEvalTotalLoss = 0;
  let totalUserMoves = 0;
  let totalBotMoves = 0;
  for (let ply = 0; ply < historyTimeline.length - 1; ply++) {
    const startFen = historyTimeline[ply].fen;
    const nextEntry = historyTimeline[ply + 1];
    if (!nextEntry.move) continue;
    const playedMove = nextEntry.move;
    const isPlayer = playedMove.color === playerColor;
    if (isPlayer) totalUserMoves++;else totalBotMoves++;

    // Quick depth-3 MultiPV analysis of this position
    const searchRes = runLocalEngineSearch(startFen, {
      depth: 3,
      multiPv: 3
    });
    if (searchRes.lines.length === 0) continue;
    const bestLine = searchRes.lines[0];
    const sideSign = playedMove.color === 'w' ? 1 : -1;

    // Check if played move matches best
    if (playedMove.lan === bestLine.bestMoveUci) {
      continue;
    }
    const matchedLine = searchRes.lines.find(l => l.bestMoveUci === playedMove.lan);
    let playedScore = matchedLine ? (matchedLine.scoreCp ?? 0) * sideSign : ((bestLine.scoreCp ?? 0) - 75) * sideSign;
    const bestScore = (bestLine.scoreCp ?? 0) * sideSign;
    const cpLoss = Math.max(0, bestScore - playedScore);
    if (isPlayer) userEvalTotalLoss += cpLoss;else botEvalTotalLoss += cpLoss;
    let category = 'Хороший ход';
    if (cpLoss >= 250) {
      category = 'Зевок';
    } else if (cpLoss >= 120) {
      category = 'Ошибка';
    } else if (cpLoss >= 45) {
      category = 'Неточность';
    }
    if (category === 'Ошибка' || category === 'Зевок' || category === 'Неточность') {
      const entry = {
        ply: ply + 1,
        color: playedMove.color,
        playedMoveSan: playedMove.san,
        playedMoveUci: playedMove.lan,
        bestMoveSan: bestLine.bestMoveSan,
        bestMoveUci: bestLine.bestMoveUci,
        cpLoss,
        category,
        explanation: `${category} (-${(cpLoss / 100).toFixed(2)} п.): сыграно ${playedMove.san}, тогда как движок рекомендовал ${bestLine.bestMoveSan}.`
      };
      if (!isPlayer) {
        botMistakes.push(entry);
      } else {
        userMissedOpportunities.push(entry);
      }
    }
  }
  const accuracyUserPercent = totalUserMoves > 0 ? Math.max(40, Math.min(99, Math.round(100 - userEvalTotalLoss / totalUserMoves * 0.28))) : 85;
  const accuracyBotPercent = totalBotMoves > 0 ? Math.max(40, Math.min(99, Math.round(100 - botEvalTotalLoss / totalBotMoves * 0.28))) : 85;
  return {
    botMistakes,
    userMissedOpportunities,
    totalBotMoves,
    totalUserMoves,
    accuracyUserPercent,
    accuracyBotPercent
  };
}
